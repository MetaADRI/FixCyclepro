services:
  # Web — serves the admin panel, customer PWA, and Android API
  - type: web
    runtime: php
    name: fixcycle-web
    buildCommand: >
      composer install --no-dev --prefer-dist --optimize-autoloader
      && php artisan migrate --force
      && npm ci && npm run build
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # config/queue.php reads QUEUE_DRIVER; Laravel also honors QUEUE_CONNECTION
      - key: QUEUE_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_DRIVER
        value: file
      - key: LOG_CHANNEL
        value: daily
    disk:
      name: fixcycle-storage
      mountPath: /var/www/html/storage
      sizeGB: 5

  # Worker — MANDATORY: database queues (payments, notifications) stall without it
  - type: worker
    runtime: php
    name: fixcycle-worker
    buildCommand: composer install --no-dev --prefer-dist --optimize-autoloader
    startCommand: php artisan queue:work --tries=3 --sleep=3
    envVarsFrom:
      - type: synced
        targetService: fixcycle-web
